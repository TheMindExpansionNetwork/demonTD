name: Protocol drift

# Watch demon-public-demo for protocol changes that the DEMON server has
# almost certainly already shipped. The web client updates in lockstep
# with the server, so if its TS surface adds a new message type / slice
# flag / SessionConfig field that we don't handle, our textports will
# start filling with `Bad slice` errors next time a user connects.
#
# This workflow runs the static drift script. On detection it files (or
# updates) a single labeled GitHub issue. PR runs post a non-blocking
# warning annotation. No merge or release is ever blocked.

on:
  schedule:
    # 14:00 UTC daily (06:00 PT / 10:00 ET). Quiet hour, post-Daydream
    # working day so any morning DEMON deploys are reflected by the time
    # we check.
    - cron: "0 14 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/wire.py"
      - "src/demon_ext.py"
      - "scripts/check_protocol_drift.py"
      - ".github/workflows/protocol-drift.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout demonTD
        uses: actions/checkout@v4
        with:
          path: demonTD

      - name: Checkout demon-public-demo
        uses: actions/checkout@v4
        with:
          repository: daydreamlive/demon-public-demo
          path: demon-public-demo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run drift check
        id: drift
        working-directory: demonTD
        continue-on-error: true
        run: |
          python scripts/check_protocol_drift.py \
              --demonTD . \
              --demon-public-demo ../demon-public-demo \
              --json > drift.json
          # Also emit the human-readable form into the step log.
          python scripts/check_protocol_drift.py \
              --demonTD . \
              --demon-public-demo ../demon-public-demo

      - name: Show drift JSON in log
        if: always()
        run: cat demonTD/drift.json || true

      - name: Open or update drift issue (cron / dispatch)
        if: steps.drift.outcome == 'failure' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(
              fs.readFileSync('demonTD/drift.json', 'utf8'));
            const categories = report.drift.map(d => d.category).join(', ');
            const title = `Protocol drift: ${categories}`;
            const body = [
              '`scripts/check_protocol_drift.py` detected protocol surface',
              'that demon-public-demo has but demon-td does not handle.',
              '',
              `- demon-public-demo: \`${report.demon_public_demo_sha}\``,
              `- demonTD:           \`${report.demonTD_sha}\``,
              '',
              '## Drift report',
              '',
              '```json',
              JSON.stringify(report.drift, null, 2),
              '```',
              '',
              '## How to resolve',
              '',
              '1. Pull latest `demon-public-demo`.',
              '2. Inspect each drift item against the source files in',
              '   `vendor/demon-ui/types/protocol.ts`,',
              '   `vendor/demon-ui/engine/protocol.ts`.',
              '3. Patch `src/demon_ext.py` / `src/wire.py` accordingly.',
              '4. Re-run `python scripts/check_protocol_drift.py ...`',
              '   locally until clean.',
              '',
              '_This issue is auto-managed by `.github/workflows/protocol-drift.yml`._',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'protocol-drift',
              state: 'open',
            });
            if (existing.length === 0) {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['protocol-drift', 'auto-filed'],
              });
              core.notice(`Opened drift issue #${created.number}`);
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                title,
                body,
              });
              core.notice(`Updated drift issue #${existing[0].number}`);
            }

      - name: PR warning annotation
        if: steps.drift.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning title=Protocol drift detected::demon-public-demo has protocol surface that this branch doesn't handle. See drift.json above. Not blocking — but probably want to address before release."

      - name: Mark job failed if drift on cron/dispatch
        if: steps.drift.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          # Surface the drift in the workflow summary status. The issue
          # is the actionable artifact; the red X is just a visual cue.
          exit 1
